# CoderXP Web - Nginx reverse proxy (coderxp.pro)

# HTTP: ACME + redirect to HTTPS
server {
    listen 80;
    server_name coderxp.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /ws/devbox/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: main site, streaming endpoint, workspace
server {
    listen 443 ssl http2;
    server_name coderxp.pro;

    ssl_certificate /etc/letsencrypt/live/coderxp.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coderxp.pro/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 10m;

    # Streaming Agent endpoint with rate-limiting backstop
    location = /api/agent/stream {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        add_header X-Accel-Buffering no always;
    }

    # API endpoints rate-limiting backstop
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Devbox WebSocket PTY Broker
    location /ws/devbox/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Main Next.js Application UI & Static Assets (Unrestricted UI)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
